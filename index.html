<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>Pancadaria Municipal · Pato Branco</title>
<link rel="icon" href="design/simbolo.svg" type="image/svg+xml">
<link rel="stylesheet" href="design/tokens.css">
<link rel="stylesheet" href="estilo.css">
<script type="module" src="src/municipal.js?v=rig-piloto-20261109"></script>
</head>
<body>
<main>
  <header class="marca">
    <img src="design/logo.svg" width="840" height="224" alt="Pancadaria Municipal">
    <div><span>FLIPERAMA DE PRAÇA</span><strong>EDIÇÃO 01 · PATO BRANCO</strong></div>
  </header>
  <section id="selecao">
    <ol class="etapas" aria-label="Etapas do duelo">
      <li data-step-label="0"><b>01</b> Seu lutador</li><li data-step-label="1"><b>02</b> Adversário</li><li data-step-label="2"><b>03</b> Arena</li>
    </ol>
    <div class="intro"><p id="etapa" class="eyebrow"></p><h1 id="titulo-selecao" tabindex="-1"></h1></div>
    <p id="status-artes" role="status">Carregando artes dos personagens…</p>
    <div class="escolhas" id="escolhas-lutadores">
      <div class="elenco" id="elenco" aria-label="Lutadores disponíveis"></div>
      <aside class="ficha" aria-labelledby="nome-ficha">
        <p class="eyebrow" id="lado-ficha"></p>
        <canvas id="retrato" width="420" height="310" aria-hidden="true"></canvas>
        <h2 id="nome-ficha"></h2><p id="golpes-ficha"></p><p id="descricao-ficha"></p>
      </aside>
    </div>
    <div class="elenco elenco-arenas" id="escolhas-arenas" aria-label="Arenas disponíveis" hidden></div>
    <div class="rodape"><button id="voltar-etapa" hidden>← Voltar ao seu lutador</button><p id="resumo-selecao"></p><button id="avancar" class="principal" disabled></button></div>
    <p id="carregamento" role="status" hidden></p>
  </section>
  <section id="duelo" hidden>
    <div class="intro combate"><div><p class="eyebrow" id="edicao-duelo"></p><h1>Duelo · <em id="arena-duelo"></em></h1></div><button id="voltar">Trocar lutadores ou arena</button></div>
    <div class="arena">
      <canvas width="1146" height="672" aria-label="Arena de combate"></canvas>
      <div class="placar">
        <div class="lado"><strong id="nome0"></strong><progress id="vida0" aria-label="Vida do jogador" max="100" value="100"></progress><small id="especial0"></small></div>
        <time id="tempo">60</time>
        <div class="lado direita"><strong id="nome1"></strong><progress id="vida1" aria-label="Vida da máquina" max="100" value="100"></progress><small id="especial1"></small></div>
      </div>
      <div id="chamada" class="chamada" aria-live="polite"></div>
      <div id="fim" class="fim" hidden><div><p class="eyebrow">FIM DO DUELO</p><h2 id="resultado"></h2><button id="revanche" class="principal">Revanche</button></div></div>
    </div>
    <div class="rodape comandos"><p>← → Mover · ↑ Pular · ↓ Defender · Z Golpe · X Especial · <strong>↓ + Z Rasteira</strong></p><div aria-label="Controles na tela">
      <button data-key="ArrowLeft" aria-label="Esquerda">←</button><button data-key="ArrowRight" aria-label="Direita">→</button><button data-key="ArrowUp" aria-label="Pular">↑</button><button data-key="ArrowDown" aria-label="Defender">↓</button><button data-key="KeyZ">Golpe</button><button data-key="KeyX">Especial</button><button data-key="Sweep">Rasteira</button>
    </div></div>
  </section>
</main>
</body>
</html>
