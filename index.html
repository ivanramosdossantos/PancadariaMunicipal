<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171210">
<title>Pancadaria Municipal · Pato Branco</title>
<link rel="stylesheet" href="estilo.css">
<script type="module" src="src/municipal.js"></script>
</head>
<body>
<main>
  <header><span>◆ PANCADARIA MUNICIPAL</span><span>EDIÇÃO 01 / PATO BRANCO</span></header>
  <section id="selecao">
    <div class="intro"><p id="etapa" class="eyebrow"></p><h1 id="titulo-selecao" tabindex="-1"></h1></div>
    <div class="escolhas">
      <div class="elenco" id="elenco" aria-label="Lutadores disponíveis"></div>
      <aside class="ficha" aria-labelledby="nome-ficha">
        <p class="eyebrow" id="lado-ficha"></p>
        <canvas id="retrato" width="420" height="310" aria-hidden="true"></canvas>
        <h2 id="nome-ficha"></h2><p id="golpes-ficha"></p><p id="descricao-ficha"></p>
      </aside>
    </div>
    <div class="rodape"><button id="voltar-etapa" hidden>← Voltar ao seu lutador</button><p id="resumo-selecao"></p><button id="avancar" class="principal" disabled></button></div>
    <p id="carregamento" role="status">Carregando a arena…</p>
  </section>
  <section id="duelo" hidden>
    <div class="intro combate"><div><p class="eyebrow">ARENA 01 · PRAÇA DA MATRIZ</p><h1>Duelo na <em>Matriz</em></h1></div><button id="voltar">Trocar lutadores</button></div>
    <div class="arena">
      <canvas width="1146" height="672" aria-label="Arena de combate na Matriz de Pato Branco"></canvas>
      <div class="placar">
        <div class="lado"><strong id="nome0"></strong><progress id="vida0" aria-label="Vida do jogador" max="100" value="100"></progress><small id="especial0"></small></div>
        <time id="tempo">60</time>
        <div class="lado direita"><strong id="nome1"></strong><progress id="vida1" aria-label="Vida da máquina" max="100" value="100"></progress><small id="especial1"></small></div>
      </div>
      <div id="chamada" class="chamada" aria-live="polite"></div>
      <div id="fim" class="fim" hidden><div><p class="eyebrow">FIM DO DUELO</p><h2 id="resultado"></h2><button id="revanche" class="principal">Revanche</button></div></div>
    </div>
    <div class="rodape comandos"><p>← → Mover · ↑ Pular · ↓ Defender · Z Golpe · X Especial</p><div aria-label="Controles na tela">
      <button data-key="ArrowLeft" aria-label="Esquerda">←</button><button data-key="ArrowRight" aria-label="Direita">→</button><button data-key="ArrowUp" aria-label="Pular">↑</button><button data-key="ArrowDown" aria-label="Defender">↓</button><button data-key="KeyZ">Golpe</button><button data-key="KeyX">Especial</button>
    </div></div>
  </section>
</main>
<img id="matriz" src="matriz.svg" alt="" hidden>
</body>
</html>
