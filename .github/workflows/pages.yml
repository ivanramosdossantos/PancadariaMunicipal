name: Publicar Pancadaria Municipal no GitHub Pages

on:
  push:
    branches: [motor-combate]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout motor-combate
        uses: actions/checkout@v4
      - name: Extrair pacote de artes, quando presente
        run: |
          if [ -f artes-pancadaria.zip ]; then
            unzip -oq artes-pancadaria.zip -d .
          fi
      - name: Verificar arquivos do jogo
        run: |
          test -f index.html
          test -f estilo.css
          test -f src/municipal.js
          test -f src/elenco.js
          test -f design/logo.svg
          for id in periquito pagodeiro prefeito gladiador oaa patinho; do
            node skills/verificar-pacote.mjs lutador "src/lutadores/$id"
            for voz in selecao especial vitoria; do
              test -s "src/lutadores/$id/vozes/$voz.mp3"
            done
            for asset in retrato pose sprites; do
              test -s "assets/lutadores/$id/$asset.png" || {
                echo "::error::Arte ausente: assets/lutadores/$id/$asset.png"
                exit 1
              }
            done
          done
          test -s src/pix/qr-code.png
          node --check src/indicacoes.js
          node --check src/pix/codigo.js
          node --check < integracoes/google-sheets/Code.gs
          node --check src/apoio-pix.js
          node skills/verificar-pacote.mjs lutador src/lutadores/desastroso
          node --check src/municipal.js
          node --check src/patrocinios.js
          node --check src/arte-pacotes.js
          node --check src/scenes/BattleScene.js
          node --check src/musica.js
          node --check src/vozes.js
          for faixa in src/audio/largada-de-praca.mp3 src/arenas/audio/{prefeitura.mp3,bobodromo.mp3,matriz.m4a}; do
            test -s "$faixa"
          done
      - name: Preparar arquivos estáticos
        run: |
          mkdir -p _site
          cp index.html estilo.css matriz.svg _site/
          cp -R src design _site/
          if [ -d assets ]; then cp -R assets _site/; fi
          : > _site/.nojekyll
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
